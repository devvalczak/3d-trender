[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "3d-trender"
version = "0.1.0"
description = "Trendy, konkurencja, modele i kalkulacja kosztów dla sprzedaży wydruków 3D"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-multipart>=0.0.9",
    "numpy>=1.26",
]

[project.optional-dependencies]
pytrends = ["pytrends>=4.9"]
dev = ["pytest>=8"]

[project.scripts]
3d-trender = "trender.main:run"

[tool.setuptools.packages.find]
include = ["trender*"]

[tool.setuptools.package-data]
trender = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
